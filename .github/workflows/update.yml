name: update-data
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 미국 장 마감 후 -> sox, nasdaq, spx
    - cron: "0 8 * * 1-5"     # 한국 장 마감 후 (KST 17:00) -> kospi, kosdaq
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y fonts-nanum || true
      - run: pip install yfinance pandas numpy requests pykrx lxml html5lib Pillow
      - name: pick markets
        id: mk
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M=all
          elif [ "$(date -u +%H)" -lt 12 ]; then M=kr
          else M=us
          fi
          echo "m=$M" >> "$GITHUB_OUTPUT"
      - run: python update_data.py --markets ${{ steps.mk.outputs.m }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data update $(date -u +%FT%H:%M)"
          git push
      - name: notify failure
        if: failure()
        run: |
          if [ -n "${{ secrets.TG_TOKEN }}" ]; then
            curl -s "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TG_CHAT }}" -d text="공포탐욕지수 워크플로 실패: run ${{ github.run_id }}"
          fi
