  const y = v => MP.top + (100-v)/100*(hgt-MP.top-MP.bottom);
  let h = "";
  h += `<rect x="${MP.left}" y="${y(100)}" width="${w-MP.left-MP.right}" height="${y(55)-y(100)}" fill="var(--greed-wash)"/>`;
  h += `<rect x="${MP.left}" y="${y(45)}" width="${w-MP.left-MP.right}" height="${y(0)-y(45)}" fill="var(--fear-wash)"/>`;
  for(const g of [0,25,45,55,75,100]){
    h += `<line x1="${MP.left}" x2="${w-MP.right}" y1="${y(g)}" y2="${y(g)}" stroke="var(--grid)"/>`;
    h += `<text x="${MP.left-8}" y="${y(g)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${g}</text>`;
  }
  for(let t=0;t<=6;t++){
    const i = Math.round(a + (N-1-a)*t/6);
    h += `<text x="${xS(i,a,w)}" y="${hgt-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${DATES[i].slice(2,7).replace("-",".")}</text>`;
  }
  keys.forEach((k,j)=>{
    let p = "";
    for(let i=a;i<N;i++){ if(MAP[k][i]==null) continue; p += (p?"L":"M") + xS(i,a,w).toFixed(1) + "," + y(MAP[k][i]).toFixed(1); }
    h += `<path d="${p}" fill="none" stroke="${COLS[j]}" stroke-width="1.8" stroke-linejoin="round" opacity="0.9"/>`;
  });
  h += `<line id="ch" y1="${MP.top}" y2="${hgt-MP.bottom}" stroke="var(--baseline)" style="display:none"/>`;
  h += `<rect id="ov" x="${MP.left}" y="${MP.top}" width="${w-MP.left-MP.right}" height="${hgt-MP.top-MP.bottom}" fill="transparent"/>`;
  svg.innerHTML = h;
  const ov = svg.querySelector("#ov"), ch = svg.querySelector("#ch"), tt = document.getElementById("tt");
  ov.addEventListener("mousemove", e=>{
    const r = svg.getBoundingClientRect();
    const frac = (e.clientX - r.left - MP.left)/(w-MP.left-MP.right);
    const i = Math.max(a, Math.min(N-1, Math.round(a + frac*(N-1-a))));
    const x = xS(i,a,w);
    ch.setAttribute("x1",x); ch.setAttribute("x2",x); ch.style.display="";
    tt.innerHTML = `<b>${fmt(DATES[i])}</b><br>` + keys.map((k,j)=>{
      const v = MAP[k][i];
      return `<span style="color:${COLS[j]}">${NAMES[k]}</span> ${v==null?"-":v.toFixed(0)}`;
    }).join("<br>");
    tt.style.display = "block";
    tt.style.left = Math.min(svg.parentElement.clientWidth-190, Math.max(0, x+14)) + "px";
    tt.style.top = "30px";
  });
  ov.addEventListener("mouseleave", ()=>{ ch.style.display="none"; tt.style.display="none"; });
}
document.getElementById("rangebar").addEventListener("click", e=>{
  if(e.target.tagName!=="BUTTON") return;
  months = +e.target.dataset.m;
  document.querySelectorAll("#rangebar button").forEach(b=>b.classList.toggle("on", b===e.target));
  render();
});
render();
window.addEventListener("resize", render);
</script>
</body>
</html>
